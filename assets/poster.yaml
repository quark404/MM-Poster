# A0 portrait; venue constraints override the upstream landscape default.
main_text_font_size: 28
section_title_font_size: 42
poster_title_font_size: 67
poster_author_font_size: 23
title_text_color: [34, 34, 34]
title_fill_color: null
main_text_color: [34, 34, 34]
main_text_fill_color: null
section_title_vertical_align: bottom
section_title_symbol: ""
# Additional settings consumed by this repository's deterministic renderer.
robopin:
  width_mm: 841
  height_mm: 1189
  brand_font_size: 155
  gradient_start: "#00798B"
  gradient_end: "#12A58F"
  accent_rgb: [229, 76, 100]
  paper_background_rgb: [255, 255, 255]
  baseline_chart_colors: ["#CFD9DF", "#AEBEC9", "#7E98AB"]

# Current reference typography uses flat coral bars, with no gradients or backdrop.
heading_font: Comic Neue
body_font: Open Sans
